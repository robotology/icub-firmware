# the viewer of theLogger (embot::svc::theLogger). install once, in a venv, from this folder:
#   pip install -e .
# then the commands `embot-logger` (logger.py) and `embot-logger-emulator` (logger_emulator.py). the name is not just
# `logger`, which on linux is the command of syslog.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "embot-logger"
version = "1.0"
description = "The viewer of theLogger: the lines of embot::core::print() of one or more boards, over UDP"
requires-python = ">=3.11"
dependencies = ["nicegui"]          # only for the page: --cli needs nothing

[project.scripts]
embot-logger = "logger:main"
embot-logger-emulator = "logger_emulator:main"

[tool.setuptools]
py-modules = ["logger", "logger_emulator"]
