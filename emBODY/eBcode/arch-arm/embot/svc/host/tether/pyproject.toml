# tether: the host of TETHER (embot::svc::theTETHERservice). install once, in a venv, from this folder:
#   pip install -e .
# then the command `embot-tether` runs tether.py (rpc, str). -e (editable): the venv points to these files, so a git pull is
# enough to update it.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "embot-tether"
version = "6.0"
description = "The host of TETHER: ask / set / run on the Dictionary of a board (rpc) and the plots of its stream (str)"
requires-python = ">=3.11"
dependencies = ["nicegui"]          # only for the pages: the text interface (--cli) needs nothing

[project.scripts]
embot-tether = "tether:main"

[tool.setuptools]
py-modules = ["tether", "tethercodec"]
