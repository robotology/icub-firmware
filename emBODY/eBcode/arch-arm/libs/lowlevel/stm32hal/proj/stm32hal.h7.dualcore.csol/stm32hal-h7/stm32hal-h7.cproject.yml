# CMSIS project of the stm32hal library (ST HAL + LL drivers of the STM32H7, with the embot glue stm32hal.c / lowlevel.c).
# Hand-converted from the targets amcmj1.2cm4-v1B6 and amcmj1.1cm7-v1B6 of stm32hal.h7.dualcore.uvprojx: they differ in
# device and board define (target-types of the solution) and in stm32h7xx_ll_usb.c, which the CM7 target does not build.
# The HAL template files (stm32h7xx_hal_msp_template.c, stm32h7xx_hal_timebase_*_template.c) are not built.
# All paths are relative to this file, which is in stm32hal.h7.dualcore.csol/stm32hal-h7/ two levels below the
# folder of the .uvprojx:
# they are the paths of the .uvprojx with ../../ in front.

project:

  output:
    base-name: stm32hal.csol.h7.$TargetType$.$BuildType$
    type:
      - lib

  # uVision After Build: copy of the library to stm32hal/lib. Here the name has the dotted board.core of uVision (a
  # target-type cannot contain '.') and the prefix stm32hal.csol. so that the uVision libraries are never overwritten.
  # It runs after the library is built, with the build button of VS Code and with cbuild (not with cbuild --context).
  executes:
    - execute: copy-lib-amcmj1-2cm4
      run: ${CMAKE_COMMAND} -E copy $input$ $output$
      input:
        - $lib()$
      output:
        - $ProjectDir()$/../../../lib/stm32hal.csol.h7.amcmj1.2cm4.v1B6.lib
      for-context: .v1B6+amcmj1-2cm4

    - execute: copy-lib-amcmj1-1cm7
      run: ${CMAKE_COMMAND} -E copy $input$ $output$
      input:
        - $lib()$
      output:
        - $ProjectDir()$/../../../lib/stm32hal.csol.h7.amcmj1.1cm7.v1B6.lib
      for-context: .v1B6+amcmj1-1cm7

    # With ATfE the library is an archive lib<base-name>.a: it is copied as stm32hal.csol.atfe.h7.<board>.<core>.v1B6.a
    - execute: copy-lib-atfe-amcmj1-2cm4
      run: ${CMAKE_COMMAND} -E copy $input$ $output$
      input:
        - $lib()$
      output:
        - $ProjectDir()$/../../../lib/stm32hal.csol.atfe.h7.amcmj1.2cm4.v1B6.a
      for-context: .v1B6-atfe+amcmj1-2cm4

    - execute: copy-lib-atfe-amcmj1-1cm7
      run: ${CMAKE_COMMAND} -E copy $input$ $output$
      input:
        - $lib()$
      output:
        - $ProjectDir()$/../../../lib/stm32hal.csol.atfe.h7.amcmj1.1cm7.v1B6.a
      for-context: .v1B6-atfe+amcmj1-1cm7

  # uVision: Optimization -Os balanced. It is set in misc below (C-CPP: -Os)
  # because the csolution key "optimize: balanced" maps to -O2 with AC6.
  # uVision: AC5-like warnings. Not reproduced (no csolution key for it): the default warnings of the toolbox are used.
  # It does not change the code.
  # uVision: C99
  language-C: c99

  define:
    - USE_STM32HAL
    - STM32H747xx
    # uVision: given in Misc Controls as -DSTM32HAL_USE_LOWLEVEL_DELAY
    - STM32HAL_USE_LOWLEVEL_DELAY

  add-path:
    - ../../../api

  misc:
    - C-CPP:
        - -Os
        - -fshort-enums
        - -fshort-wchar
        - -ffunction-sections

  groups:
    - group: stm32hal
      files:
        - file: ../../../src/stm32hal/stm32hal.c
        - file: ../../../src/stm32hal/lowlevel.c
          # uVision: this file is built with -O0
          optimize: none

    - group: board-generic
      files:
        - file: ../../../src/board/generic/src/board_generic.c

    - group: driver-stm32h7-v1B6
      # the HAL version v1B6: only in the build-types v1B6 and v1B6-atfe (their include path and define are there too)
      for-context:
        - .v1B6
        - .v1B6-atfe
      files:
        - file: ../../../src/driver/stm32h7-v1B6/src/stm32h7xx_hal.c
        - file: ../../../src/driver/stm32h7-v1B6/src/stm32h7xx_hal_adc.c
        - file: ../../../src/driver/stm32h7-v1B6/src/stm32h7xx_hal_adc_ex.c
